# Selected Hyperparameter Configuration
# All defaults - no systematic variations applied
# Override individual values via CLI: python script.py hyperparams.co_shift=0.5

# Co-60 calibration region cut selection
# Value is key into cuts.co_cuts (None, v150, gamma10, gamma10_v150)
co_cuts: gamma10_v150

# Signal region cut override
# Value is key for alternative ndbd_cutoff (None, u1740, u1775)
ndbd_cutoff: u1740

# Energy scale systematics (keV)
co_shift: 1.0
ndbd_shift: 0.0
co_shift_values: [0.0, 0.3, 0.5, 0.8, 1.0, 1.2, 1.5, 1.8, 2.0]

# Histogram bin sizes in (e1, e2) space (keV), for the bin-size fit matrix.
bin_size_values: [1.0, 2.5, 5.0, 10.0]

# Data selection options
blinded: false
skip_roi: false  # false or [min, max] to exclude ROI region

# Processing options
smooth: true

# MCMC sampling (for validation studies)
sample_mkchain: 100

# @package _global_
# M2v5 upto 2700 keV Environment Configuration
# Use via: environment=m2_2700

defaults:
  - base

infrastructure:
  output_paths:
    # Base results directory — plots_dir, systematic_dir, toy_results_dir are derived from this
    staging_dir: "/global/cfs/projectdirs/cuore/scratch/xcorat/data/MC/staging_2700"
    data_dir: "/global/homes/x/xcorat/Analysis/M2/QPyM2_v5.1/QPyM2/data_2700"
    fit_dir:  "/global/homes/x/xcorat/Analysis/M2/QPyM2_v5.1/QPyM2/data_2700/fits"
    plots_dir: "/global/homes/x/xcorat/Analysis/M2/QPyM2_v5.1/QPyM2/data_2700/plots"
  
  data_files:
    fit_input_pattern: "input.h5"
    fit_result_pattern: "fit.h5"
    fit_trace_pattern: "fit.nc"
    lss_data_path: "/global/homes/x/xcorat/Software/cuore-nersc-modern_v4.0.0/cuoremc/ares/data/Nature2021"

  naming_conventions:
    analysis_name: "m2_2700"
    # model_dir_pattern: "model_{co_cut}_{ndbd_cutoff}_{co_shift}"

system:
  verbose_logging: false

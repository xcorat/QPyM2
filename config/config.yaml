# QPyM2 Master Configuration (v0.6)
# Hydra composition over config tiers

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

defaults:
  - environments: local
  - staging: default
  - analysis: base
  - models: tech_note
  - _self_

pipeline:
  name: "qpym2"
  version: "0.6.0"

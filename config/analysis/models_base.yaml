# @package _global_
# Base Model Configuration
# ALL MODEL-RELATED PARAMETERS: cuts, thresholds, ROI, binning
# NO PATHS OR ENVIRONMENT SETTINGS HERE
#
# WARNING: This file defines canonical defaults for ALL analysis/model settings.
# Do NOT edit this file — use analysis-specific overrides (e.g. m2.yaml)
# or CLI overrides instead. Missing keys here will raise errors at runtime.

# Base model template for inheritance
base_model:
  histogram_type: "h2uv"
  binning:
    bin_size: 1
  smoothing:
    enabled: true
    kernel: "k5b"
    iterations: 1

# Background component groupings for fit
# Each entry defines a group of MC sources merged into one fit component.
# filter_regex: include sources matching this regex
# filter_regex_inverse: include sources NOT matching this regex
components:
  - name: co60
    filter_regex: "60Co"
  - name: u238
    filter_regex: "238U|210Pb"
  - name: th232
    filter_regex: "232Th|208Pb"
  - name: others
    filter_regex_inverse: "60Co|238U|210Pb|232Th|208Pb"

# Definitions of cuts used in models
cuts:
  # Legacy-compatible defaults: multiplicity selection is applied separately.
  base_cuts: "Multiplicity==2"
  data_cuts: "PCA && Validation && cutsTree.Included && cutsTree.FullMultiplet"
  mc_cuts: "true"
  
  # Co-60 calibration cut definitions (selected via hyperparams.co_cuts)
  co_cuts:
    none: "None"
    v150: "v>150"
    gamma10: "abs(e1-1334)>10 && abs(e2-1173)>10"
    gamma10_v150: "abs(e1-1334)>10 && abs(e2-1173)>10 && v>150"
  
  # Signal region cutoff definitions (selected via hyperparams.ndbd_cutoff)
  ndbd_cutoff:
    none: "None"
    u1740: "u>1740"
    u1775: "u>1775"

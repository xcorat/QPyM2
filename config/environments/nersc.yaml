# @package _global_
# M2 Environment Configuration
# Use via: environment=nersc

defaults:
  - base

infrastructure:
  output_paths:
    # Base results directory — plots_dir, systematic_dir, toy_results_dir are derived from this
    data_dir: "/global/homes/x/xcorat/Analysis/M2/QPyM2x/data/"
    fit_dir:  "/global/homes/x/xcorat/Analysis/M2/QPyM2x/data/fits"
    plots_dir: "/global/homes/x/xcorat/Analysis/M2/QPyM2x/data/plots"
    logs_dir: "/global/homes/x/xcorat/Analysis/M2/QPyM2x/data/logs"

  directories:
    reduced_data_dir: "/global/homes/x/xcorat/Software/cuore-nersc-modern_v4.0.0/cuoremc/ares/data/Nature2021"

  data_files:
    fit_input_pattern: "input.h5"
    fit_result_pattern: "fit.h5"
    fit_trace_pattern: "fit.nc"
    lss_data_path: "/global/homes/x/xcorat/Software/cuore-nersc-modern_v4.0.0/cuoremc/ares/data/Nature2021"

  naming_conventions:
    analysis_name: "m2uv"
    # model_dir_pattern: "model_{co_cut}_{ndbd_cutoff}_{co_shift}" # TODO: remove?

system:
  verbose_logging: false

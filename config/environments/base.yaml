# @package _global_
# Base Environment Configuration (example defaults)
#
# Path convention
# ---------------
# * `infrastructure.data_root` is the single base for data and MUST be an
#   absolute path (starts with "/"). Set it per machine in your own config
#   directory (e.g. data/config/environments/*.yaml) or via QPYM2_DATA_DIR.
# * Every other folder path is used as-is when absolute, otherwise it is
#   resolved relative to `data_root`.
# * The repository root is determined by the code and is never configured.
# * No OmegaConf "${...}" interpolation is used for paths.

infrastructure:
  data_root: null

  # Raw input directories (relative to data_root).
  directories:
    bm_dir: "BM_1ton"
    ndbd_mc_dir: "MC/ares/0vbb"
    bkg_mc_dir: "MC/ares"

  # Output locations (relative to data_root).
  output_paths:
    staging_dir: "staging"
    fit_dir: "fits"
    plots_dir: "plots"
    artifact_store: "artifact_store"
    data_dir: null
    systematic_dir: null
    toy_results_dir: null

  # Input files.
  data_files:
    jags_output: "BM_1ton/fit/Output/default/Out.h5"
    reduced_data: "Reduced_1ton.root"
    bkg_syst_corrmat: null
    lss_data_path: null

  # File naming conventions (not paths; never resolved).
  naming_conventions:
    ndbd_staging: "ndbd"
    data_name: "data"
    data_blinded_name: "data_blinded"
    input_name: "input"
    input_noroi_name: "input_noroi"

qroot:
  tree_name: "outTree"
  energy_var: "Energy"
  esum_var: "TotalEnergy"
  channel_vars: ["Channel", "Multiplet[1]"]
  output_tree_name: "uvtree"
  output_columns: ["u0", "v0", "ch1", "ch2", "ds", "t"]

system:
  matplotlib_backend: "Agg"
  verbose_logging: false

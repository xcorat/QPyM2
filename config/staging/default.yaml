# @package _global_
# Default Staging Configuration
# Transformation/selection contract only (raw -> staged uvtree ROOT).
# Source and output paths live in the environment tier; ROOT tree/branch names
# come from `qroot`. Per the model-parameter taxonomy, staging must not depend
# on model ROI, co_cut, ndbd_cutoff, binning, smoothing, or shifts.

staging:
  version: 1
  cuts:
    base: "true"
    multiplicity: "Multiplicity == 2"
    data_quality: "PCA && Validation && cutsTree.Included && cutsTree.FullMultiplet"
    broad_preselection: "TotalEnergy >= 2390 && TotalEnergy <= 2570"
  sources:
    bkg_mc:
      pattern: "*.root"
    ndbd_mc:
      pattern: "0vbb_1M_*.root"
      out_fname: "ndbd.root"
    data:
      out_fname: "data.root"
      out_blinded_fname: "data_blinded.root"

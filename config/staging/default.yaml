# @package _global_
# Default Staging Configuration
# Transformation/selection contract (raw -> staged uvtree ROOT).
# Physical machine roots live in the environment tier.

staging:
  version: 1
  staging_input_root: "cuore_data_root"
  cuts:
    base: "true"
    multiplicity: "Multiplicity == 2"
    data_quality: "PCA && Validation && cutsTree.Included && cutsTree.FullMultiplet"
    broad_preselection: "TotalEnergy >= 2390 && TotalEnergy <= 2570"
  sources:
    bkg_mc:
      pattern: "*.root"
    ndbd_mc:
      pattern: "0vbb_1M_*.root"
      out_fname: "ndbd.root"
    data:
      out_fname: "data.root"
      out_blinded_fname: "data_blinded.root"

qroot:
  tree_name: "outTree"
  energy_var: "Energy"
  esum_var: "TotalEnergy"
  channel_vars: ["Channel", "Multiplet[1]"]
  output_tree_name: "uvtree"
  output_columns: ["u0", "v0", "ch1", "ch2", "ds", "t"]

study:
  name: example_bm_threshold_study
  type: syst
  description: "Background model threshold systematic study (Threshold250 vs Threshold200)"

defaults:
  environment: local
  staging: default
  analysis: base
  models: tech_note
  model_key: tech_note_200

reference:
  co_cut: gamma10_v150
  ndbd_cutoff: u1740
  co_shift: 1.0
  ndbd_shift: 0.0
  blinded: false

syst:
  category: bm_threshold
  variant: "Threshold250"
  model_key_syst: "tech_note_250"
  chains: 2
  draws: 2500
  tune: 500
  bias_calibration: "studies/example_bias_study/bias_calibration.json"

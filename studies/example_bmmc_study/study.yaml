study:
  name: example_bmmc_study
  type: syst
  description: "Background model MC covariance systematic study for tech_note_200"

defaults:
  environment: local
  staging: default
  analysis: base
  models: tech_note
  model_key: tech_note_200

reference:
  co_cut: gamma10_v150
  ndbd_cutoff: u1740
  co_shift: 1.0
  ndbd_shift: 0.0
  blinded: false

syst:
  category: bmmc
  n_samples: 100
  seed: 42
  chains: 2
  draws: 2500
  tune: 500
  stat_only: false
  bias_calibration: "studies/example_bias_study/bias_calibration.json"

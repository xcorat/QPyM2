study:
  name: example_lss_sscl_study
  type: syst
  description: "Energy resolution scaling (lss_sscl) systematic study for tech_note_200"

defaults:
  environment: local
  staging: default
  analysis: base
  models: tech_note
  model_key: tech_note_200

reference:
  co_cut: gamma10_v150
  ndbd_cutoff: u1740
  co_shift: 1.0
  ndbd_shift: 0.0
  blinded: false

syst:
  category: lss_sscl
  chains: 2
  draws: 2500
  tune: 500
  bias_calibration: "studies/example_bias_study/bias_calibration.json"
